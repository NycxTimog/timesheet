rder-top:1px solid #c9def5;border-bottom:1px solid #c9def5}.leave-row .leave-band{background:#dcecff!important;color:#173e6e;font-weight:800;text-align:left;vertical-align:middle;font-size:13px;letter-spacing:0;padding:10px 14px;border-left:5px solid #2580cf}.leave-row .leave-hours{background:#fff0b8!important;color:#71520a;font-weight:850;text-align:center;vertical-align:middle}.leave-row td{vertical-align:middle}.leave-action{text-align:center;vertical-align:middle!important;min-width:82px}.leave-task{min-width:150px}.work-hours-cell{background:#fff4c7!important;color:#664900;font-weight:800;text-align:center;white-space:nowrap}.comment-cell{min-width:150px;max-width:230px;color:#526176;font-size:12px}.leave-tag{display:inline-flex;align-items:center;gap:7px}.leave-tag:before{content:'●';color:#a72e35;font-size:10px}.two{grid-template-columns:1.3fr 1fr}.summary-list{display:grid;grid-template-columns:1fr 1fr;gap:8px 25px}.summary-line{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #edf0f4}.summary-line span{color:var(--muted)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.empty{padding:30px;text-align:center;color:var(--muted)}.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.form-grid label{display:grid;gap:5px;color:#536176;font-size:12px;font-weight:650}.form-grid .full{grid-column:1/-1}.task{white-space:pre-line;min-width:180px}.employee-card{display:flex;align-items:center;gap:11px}.avatar{width:35px;height:35px;border-radius:50%;display:grid;place-items:center;background:#e4effd;color:#1767b3;font-weight:750}.tabs{display:flex;gap:6px;flex-wrap:wrap}.tabs .btn.active{background:#e3efff;border-color:#c8ddf8;color:#075cb0}.notice{padding:12px 14px;background:#eef5ff;border:1px solid #d7e7fb;color:#315579;border-radius:11px;margin-bottom:15px}.clockbox{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}.clocktime{font-size:32px;font-weig /* Refined timesheet visual hierarchy */
.stats-timesheet{grid-template-columns:repeat(5,minmax(0,1fr));margin-bottom:17px}
.metric{min-width:0;padding:13px 14px;min-height:100px;border-top:3px solid transparent}
.metric .label{font-size:12px;font-weight:700;letter-spacing:.01em;color:#59677a}
.metric .value{font-size:clamp(19px,1.8vw,25px);line-height:1.2;white-space:nowrap;letter-spacing:-.5px;margin-top:9px}
.metric-hours{background:#fff9e6;border-color:#f0d36c}
.metric-ot{border-top-color:#3984d6}.metric-ot .value{color:#236db8}
.metric-ut{border-top-color:#d96a70}.metric-ut .value{color:#b94d55}
.metric-offset{border-top-color:#8a70ce}.metric-offset .value{color:#7457b8}
.metric-breakdown{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px;margin-top:9px}
.metric-breakdown button{border:1px solid var(--line);background:#f8fafc;border-radius:8px;padding:7px 8px;text-align:left;cursor:pointer;color:var(--ink);min-width:0;transition:background .18s,border-color .18s,transform .18s}
.metric-breakdown button:hover{background:#eef4fb;border-color:#b9cbe0;transform:translateY(-1px)}
.metric-breakdown button strong{display:block;font-size:14px;white-space:nowrap}
.metric-breakdown button span{display:block;color:var(--muted);font-size:10px;font-weight:750;letter-spacing:.04em}
.metric-breakdown .ot-key strong{color:#236db8}.metric-breakdown .ut-key strong{color:#b94d55}.metric-breakdown .offset-key strong{color:#7457b8}
.metric-breakdown button.active{outline:2px solid currentColor;outline-offset:1px}
tr.glow-ot td:nth-child(7){animation:glowOT 1.35s ease-in-out 2;background:#eaf3ff!important}
tr.glow-ut td:nth-child(8){animation:glowUT 1.35s ease-in-out 2;background:#fff0f0!important}
tr.glow-offset td:nth-child(9){animation:glowOffset 1.35s ease-in-out 2;background:#f2edff!important}
@keyframes glowOT{0%,100%{box-shadow:inset 0 0 0 0 #3984d600}45%{box-shadow:inset 0 0 0 3px #3984d6, inset 0 0 22px #3984d655}}
@keyframes glowUT{0%,100%{box-shadow:inset 0 0 0 0 #d96a7000}45%{box-shadow:inset 0 0 0 3px #d96a70, inset 0 0 22px #d96a7055}}
@keyframes glowOffset{0%,100%{box-shadow:inset 0 0 0 0 #8a70ce00}45%{box-shadow:inset 0 0 0 3px #8a70ce, inset 0 0 22px #8a70ce55}}
@media(prefers-reduced-motion:reduce){tr.glow-ot td:nth-child(7),tr.glow-ut td:nth-child(8),tr.glow-offset td:nth-child(9){animation:none}}
.metric-present{border-top-color:#26966d}.metric-absent{border-top-color:#d96a70}.metric-leave{border-top-color:#8a70ce}
.leave-row td{background:#eaf3ff!important;border-top:1px solid #c9def5;border-bottom:1px solid #c9def5}
.leave-row .leave-band{background:#dcecff!important;color:#173e6e;font-weight:750;text-align:left;vertical-align:middle;font-size:13px;letter-spacing:0;padding:10px 14px;border-left:5px solid #2580cf}
.leave-row .leave-hours{background:#fff0bf!important;color:#71520a;font-weight:850;text-align:center;vertical-align:middle;white-space:nowrap}
.leave-row .leave-status-cell{text-align:center;vertical-align:middle}
.leave-row .leave-status-cell .status{background:#1976c8;color:#fff;padding:6px 11px;font-size:11px;letter-spacing:.035em}
.leave-row .leave-action{background:#eaf3ff!important;text-align:center;vertical-align:middle!important;min-width:82px}
.leave-row .leave-task,.leave-row .comment-cell{background:#eaf3ff!important;color:#526176}
.leave-row .leave-tag{gap:8px}
.leave-row .leave-tag:before{content:"▣";color:#1976c8;font-size:14px}
.ot-dash,.ut-dash,.offset-dash{text-align:center;color:#8793a3}
@media(max-width:1100px){.stats-timesheet{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:600px){.stats-timesheet{grid-template-columns:repeat(2,minmax(0,1fr))}.metric{min-height:88px}.metric-breakdown{grid-template-columns:1fr}.metric-breakdown button{display:flex;justify-content:space-between;align-items:center}.metric-breakdown button strong{order:2}}
@media(max-width:900px){.stats{grid-template-columns:repeat(3,1fr)}.two{grid-template-columns:1fr}}@media(max-width:600px){.wrap{padding:0 12px 28px}.top{padding:13px 14px}.brand small{font-size:11px}.stats{grid-template-columns:repeat(2,1fr)}.stat{padding:12px}.stat .value{font-size:23px}.page-head{align-items:flex-start;flex-direction:column}.filters{width:100%}.filters select{flex:1;min-width:0}.nav{margin:12px 0 17px}.nav button{padding:9px 11px}.panel{padding:13px}.summary-list{grid-template-columns:1fr}.form-grid{grid-template-columns:1fr}.form-grid .full{grid-column:auto}}

.login-screen{min-height:calc(100vh - 95px);display:grid;place-items:center;padding:28px 16px}
.login-card{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:18px;padding:28px;box-shadow:var(--shadow)}
.login-card h1{font-size:25px;color:var(--navy);margin:0 0 6px}
.login-card p{color:var(--muted);margin:0 0 22px}
.login-form{display:grid;gap:13px}
.login-form label{display:grid;gap:6px;font-size:13px;font-weight:650;color:#536176}
.login-form input{width:100%;padding:12px}
.login-form .btn{padding:12px}
.login-error{display:none;background:#fff0f0;color:#a52e38;border:1px solid #f0caca;padding:10px 12px;border-radius:9px;font-size:13px}
.login-help{font-size:12px;color:var(--muted);margin-top:14px}

#pageRefreshOverlay{position:fixed;inset:0;z-index:9999;background:linear-gradient(120deg,#102b50,#17477d);display:grid;place-items:center;color:#fff;opacity:1;visibility:visible;transition:opacity .35s ease,visibility .35s ease}
#pageRefreshOverlay.done{opacity:0;visibility:hidden;pointer-events:none}
.refresh-mark{width:54px;height:54px;border:4px solid #ffffff55;border-top-color:#fff;border-radius:50%;animation:pageSpin .8s linear infinite}
@keyframes pageSpin{to{transform:rotate(360deg)}}
.refresh-brand{display:grid;gap:14px;justify-items:center;font-weight:700}
@media(prefers-reduced-motion:reduce){.refresh-mark{animation:none}}
.ot-pending{background:#fff0f0!important;color:#a33!important;font-weight:700}.ot-pending-label{font-size:11px;white-space:nowrap}.ot-rejected{color:#a33;text-decoration:line-through}</style></head>
<body><div id="pageRefreshOverlay"><div class="refresh-brand"><div class="refresh-mark"></div><span>ATTENDANCE MANAGEMENT</span></div></div>
<header class="top"><div class="brand"><div class="logo">▣</div><div><strong>My Attendance</strong><small>Personal Attendance Management</small></div></div><div class="top-right"><span class="role-pill" id="accountLabel">Signed out</span><button class="btn" id="logoutButton" type="button" hidden>Log out</button></div></header>
<section id="loginScreen" class="login-screen"><div class="login-card"><p class="eyebrow">ATTENDANCE MANAGEMENT</p><h1 id="loginTitle">Welcome back</h1><p id="loginIntro">Sign in with your registered account to continue.</p><form id="loginForm" class="login-form" data-mode="login"><div id="registerNameWrap" hidden><label>Full name<input id="registerFullName" type="text" autocomplete="name" maxlength="120" placeholder="Your full name"></label></div><label>Email address<input id="loginEmail" type="email" autocomplete="username" required placeholder="you@example.com"></label><label>Password<input id="loginPassword" type="password" autocomplete="current-password" required placeholder="Enter your password"></label><div id="loginError" class="login-error" role="alert" aria-live="polite"></div><button class="btn primary" id="loginSubmit" type="submit">Sign in</button></form><div class="login-help" id="loginHelp">Use your registered account to continue.</div><div class="login-actions" style="display:flex;justify-content:center;gap:16px;margin-top:16px"><button type="button" class="link-button" id="registerLink">Create employee account</button><button type="button" class="link-button" id="registerBack" hidden>Back to sign in</button></div></div></section><main class="wrap" id="appShell" hidden><nav class="nav" id="nav"></nav><div id="app"></div><div class="footer-note" id="appNotice">Attendance Management · Supabase attendance sync · Overtime approval workflow</div></main>
<div id="modalRoot"></div>
<script>
const STORE='myAttendanceDemoV1';
const months=['January','February','March','April','May','June','July','August','September','October','November','December'];
const defaultData={currentUser:'e1',employees:[{id:'e1',name:'Alex Morgan',email:'alex@example.com',role:'employee',scheduleIn:'07:00',scheduleOut:'16:00',breakHours:1},{id:'e2',name:'Jamie Lee',email:'jamie@example.com',role:'employee',scheduleIn:'09:00',scheduleOut:'18:00',breakHours:1},{id:'e3',name:'Taylor Cruz',email:'taylor@example.com',role:'employee',scheduleIn:'08:00',scheduleOut:'17:00',breakHours:1}],records:[],leaves:[],clock:null};
var data=load(),page='dashboard',selectedYear=new Date().getFullYear(),selectedMonth=new Date().getMonth(),selectedEmployee='';data.currentUser=data.currentUser||'';
function load(){try{return JSON.parse(localStorage.getItem(STORE))||structuredClone(defaultData)}catch{return structuredClone(defaultData)}}function save(){localStorage.setItem(STORE,JSON.stringify(data))}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function emp(id){return data.employees.find(e=>e.id===id)}function isAdmin(){return window.currentProfile?.role==='employer'}function pad(n){return String(n).padStart(2,'0')}function key(y,m,d){return `${y}-${pad(m+1)}-${pad(d)}`}function dateObj(k){return new Date(k+'T12:00:00')}function fmtDate(k){return dateObj(k).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'})}function timeFmt(t){if(!t)return '—';let [h,m]=t.split(':').map(Number);return new Date(2000,0,1,h,m).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'})}function mins(t){if(!t)return null;let [h,m]=t.split(':').map(Number);return h*60+m}function duration(n){if(n==null||!isFinite(n))return '—';let sign=n<0?'-':'';n=Math.abs(Math.round(n));return `${sign}${Math.floor(n/60)}h ${pad(n%60)}m`}function rec(id,k){return data.records.find(r=>r.employeeId===id&&r.date===k)}function leave(id,k){return data.leaves.find(l=>l.employeeId===id&&k>=l.start&&k<=l.end&&l.status==='Approved')}function isWeekend(k){let d=dateObj(k).getDay();return d===0||d===6}function workMode(e){return e?.workMode==='part-time'?'part-time':'full-time'}function calc(r,e){if(!r?.timeIn||!r?.timeOut)return 0;let total=mins(r.timeOut)-mins(r.timeIn)-(Number(r.breakHours??e.breakHours??1)*60);return Math.max(0,total)}function regularHours(r,e){return Math.min(calc(r,e),Math.max(0,expected(e)))}function displayExtra(n){return n>0?duration(n):'—'}function expected(e){return (mins(e.scheduleOut)-mins(e.scheduleIn))-Number(e.breakHours||1)*60}function calcStatus(id,k){let r=rec(id,k),l=leave(id,k);if(l)return l.type;if(isWeekend(k))return 'Weekend';if(r?.timeIn&&r?.timeOut)return 'Present';if(r?.timeIn)return 'In Progress';if(k>todayKey())return 'Scheduled';return 'Absent'}function todayKey(){let d=new Date();return key(d.getFullYear(),d.getMonth(),d.getDate())}function statusBadge(s){let cls=s==='Present'?'s-present':s==='Absent'?'s-absent':s==='Weekend'?'s-weekend':s==='In Progress'?'s-pending':s==='Scheduled'?'s-weekend':'s-leave';return `<span class="status ${cls}">${esc(s)}</span>`}function recordStats(id,y,m){let days=new Date(y,m+1,0).getDate(),present=0,absent=0,paid=0,hours=0,ot=0,ut=0,offset=0;for(let d=1;d<=days;d++){let k=key(y,m,d),s=calcStatus(id,k),r=rec(id,k),e=emp(id);if(s==='Present'||s==='In Progress')present++;else if(s==='Absent')absent++;else if(s!=='Weekend'&&s!=='Scheduled'&&s!=='Holiday')paid++;if(r?.timeIn&&r?.timeOut){let h=calc(r,e),regular=workMode(e)==='part-time'?h:regularHours(r,e);hours+=regular;if(workMode(e)==='part-time'){ot+=Math.max(0,Number(r.approvedOTMinutes||0));ut+=Math.max(0,Number(r.manualUTMinutes||0));}else{let diff=h-expected(e);if(diff>0)ot+=Math.max(0,Number(r.approvedOTMinutes||0));else if(diff<0)ut+=Math.abs(diff)}offset+=Number(r.offsetMinutes||0)}}return {present,absent,paid,hours,ot,ut,offset,days}}
// Supabase-backed attendance and overtime approvals.
function localTimeFromIso(value){if(!value)return '';let d=new Date(value);return `${pad(d.getHours())}:${pad(d.getMinutes())}`}
function isoFromLocal(date,time){return time?new Date(`${date}T${time}:00`).toISOString():null}
async function loadCloudAttendance(){
 const client=window.supabaseClient, profile=window.currentProfile;if(!client||!profile)return;
 let q=client.from('attendance_records').select('*').order('work_date',{ascending:true});
 if(profile.role!=='employer')q=q.eq('user_id',profile.id);
 const {data:rows,error}=await q;if(error)throw error;
 const {data:approvals,error:ae}=await client.from('overtime_approvals').select('*');if(ae)throw ae;
 data.records=(rows||[]).map(x=>{let a=(approvals||[]).find(z=>z.attendance_record_id===x.id);return {cloudId:x.id,employeeId:x.user_id,date:x.work_date,timeIn:localTimeFromIso(x.time_in),timeOut:localTimeFromIso(x.time_out),breakHours:Number(x.break_minutes||0)/60,manualOTMinutes:Number(x.overtime_minutes||0),manualUTMinutes:Number(x.undertime_minutes||0),offsetMinutes:Number(x.offset_minutes||0),tasks:x.task||'',comment:x.comment||'',approvalId:a?.id||null,otApprovalStatus:a?.status||null,approvedOTMinutes:a?.status==='approved'?Number(a.requested_minutes):0,requestedOTMinutes:a?Number(a.requested_minutes):0}});
}
function requestedOTMinutes(r,e){if(!r?.timeIn||!r?.timeOut)return 0;let worked=calc(r,e),diff=worked-expected(e);return Math.max(0,Math.round(workMode(e)==='part-time'?Number(r.manualOTMinutes||0):diff))}
async function saveCloudRecord(r){
 const client=window.supabaseClient;if(!client||!r)return;
 const payload={user_id:r.employeeId,work_date:r.date,time_in:isoFromLocal(r.date,r.timeIn),time_out:isoFromLocal(r.date,r.timeOut),break_minutes:Math.round(Number(r.breakHours||0)*60),overtime_minutes:Math.max(0,Math.round(Number(r.manualOTMinutes||0))),undertime_minutes:Math.max(0,Math.round(Number(r.manualUTMinutes||0))),offset_minutes:Math.round(Number(r.offsetMinutes||0)),task:r.tasks||null,comment:r.comment||null,updated_at:new Date().toISOString()};
 let row=null;
 if(r.cloudId){let result=await client.from('attendance_records').update(payload).eq('id',r.cloudId).select().single();if(result.error)throw result.error;row=result.data;}

function go(p){page=p;render()}function selectMonth(y,m){selectedYear=y;selectedMonth=m;page='history';render()}function viewEmployee(id){selectedEmployee=id;page='timesheet';render()}async function clockIn(id){let k=todayKey(),r=rec(id,k);if(!r){r={employeeId:id,date:k,breakHours:emp(id).breakHours,tasks:''};data.records.push(r)}if(!r.timeIn)r.timeIn=new Date().toTimeString().slice(0,5);data.clock={employeeId:id,timeIn:r.timeIn};save();try{await saveCloudRecord(r);render()}catch(e){alert('Could not save time in: '+e.message)}}async function clockOut(id){let k=todayKey(),r=rec(id,k);if(r){r.timeOut=new Date().toTimeString().slice(0,5);data.clock={employeeId:id,timeIn:r.timeIn,timeOut:r.timeOut};save();try{await saveCloudRecord(r);render()}catch(e){alert('Could not save time out: '+e.message)}}}

function openRecordModal(employeeId=data.currentUser,date=todayKey()){let id=isAdmin()?employeeId:data.currentUser,k=date,r=rec(id,k)||{},person=emp(id);if(!person)return;modal(`<h2>Edit Attendance · ${esc(person.name)}</h2><form id="recordForm" class="form-grid"><label>Date<input name="date" type="date" value="${r.date||k}" required></label><label>Break (hours)<input name="breakHours" type="number" min="0" step="0.25" value="${r.breakHours??person.breakHours}"></label><label>Time In<input name="timeIn" type="time" value="${r.timeIn||''}"></label><label>Time Out<input name="timeOut" type="time" value="${r.timeOut||''}"></label><label>Offset (minutes)<input name="offsetMinutes" type="number" value="${r.offsetMinutes||0}"></label><label>Manual OT (minutes)<input name="manualOTMinutes" type="number" min="0" value="${r.manualOTMinutes||0}"></label><label>Manual UT (minutes)<input name="manualUTMinutes" type="number" min="0" value="${r.manualUTMinutes||0}"></label><label class="full">Tasks accomplished<textarea name="tasks" rows="3" placeholder="One task per line">${esc(r.tasks||'')}</textarea></label><label class="full">Short daily comment<input name="comment" maxlength="180" value="${esc(r.comment||'')}" placeholder="Important note for this day (max 180 characters)"></label><div class="full small">You can correct any past date. Work hours and OT/UT are recalculated from the saved times and employee schedule.</div><div class="modal-actions full"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save Changes</button></div></form>`);document.getElementById('recordForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),newDate=f.get('date'),existing=rec(id,k);if(existing&&newDate!==k){existing.date=newDate}else if(!existing){existing={employeeId:id,date:newDate};data.records.push(existing)}Object.assign(existing,{employeeId:id,date:newDate,breakHours:+f.get('breakHours'),timeIn:f.get('timeIn'),timeOut:f.get('timeOut'),offsetMinutes:+f.get('offsetMinutes'),manualOTMinutes:+f.get('manualOTMinutes'),manualUTMinutes:+f.get('manualUTMinutes'),tasks:f.get('tasks'),comment:f.get('comment')});save();saveCloudRecord(existing).then(()=>{closeModal();render()}).catch(error=>alert('Could not save attendance to the server: '+error.message))}}
function openLeaveModal(){let id=data.currentUser;modal(`<h2>Schedule a Leave</h2><form id="leaveForm" class="form-grid"><label>Employee<select name="employeeId" ${isAdmin()?'':'disabled'}>${(isAdmin()?data.employees:[emp(id)]).map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join('')}</select></label><label>Leave type<select name="type"><option>Sick Leave</option><option>Birthday Leave</option><option>Vacation Leave</option><option>Christmas Break</option></select></label><label>Start date<input name="start" type="date" required></label><label>End date<input name="end" type="date" required></label><div class="full notice">All configured leave types are treated as paid. Employer approval is required before the leave appears on the timesheet.</div><div class="modal-actions full"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Submit Leave</button></div></form>`);document.getElementById('leaveForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),start=f.get('start'),end=f.get('end');if(end<start){alert('End date must be on or after start date.');return}data.leaves.push({id:'l'+Date.now(),employeeId:isAdmin()?f.get('employeeId'):id,type:f.get('type'),start,end,status:isAdmin()?'Approved':'Pending'});save();closeModal();render()}}
function openLeaveEditModal(leaveId){let l=data.leaves.find(x=>x.id===leaveId);if(!l)return;if(!isAdmin()&&l.employeeId!==data.currentUser)return;modal(`<h2>Edit Leave Request</h2><form id="leaveEditForm" class="form-grid"><label>Employee<select name="employeeId" ${isAdmin()?'':'disabled'}>${(isAdmin()?data.employees:[emp(data.currentUser)]).map(e=>`<option value="${e.id}" ${e.id===l.employeeId?'selected':''}>${esc(e.name)}</option>`).join('')}</select></label><label>Leave type<select name="type">${['Sick Leave','Birthday Leave','Vacation Leave','Christmas Break'].map(t=>`<option ${t===l.type?'selected':''}>${t}</option>`).join('')}</select></label><label>Start date<input name="start" type="date" value="${l.start}" required></label><label>End date<input name="end" type="date" value="${l.end}" required></label><div class="full notice">Editing an approved leave updates the employee's timesheet immediately. The leave remains approved unless changed by the employer.</div><div class="modal-actions full"><button type="button" class="btn" onclick="closeModal()">Cancel</button><button class="btn primary">Save Changes</button></div></form>`);document.getElementById('leaveEditForm').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),start=f.get('start'),end=f.get('end');if(end<start){alert('End date must be on or after start date.');return}Object.assign(l,{employeeId:isAdmin()?f.get('employeeId'):l.employeeId,type:f.get('type'),start,end});save();closeModal();render()}}
